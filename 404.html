<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Cats Buy — Page Not Found</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="stylesheet" href="index.css">
<style>
  .notfound-hero { position: fixed; inset: 0; display:flex; align-items:center; justify-content:center; z-index:10; text-align:center; padding:2.25rem 1rem; }
  .notfound-card { pointer-events:auto; backdrop-filter: blur(6px) saturate(1.05); background: linear-gradient(180deg, rgba(12,6,20,0.22), rgba(12,6,20,0.14)); border: 1px solid var(--card-border); padding: 1.5rem 2rem; border-radius: 14px; box-shadow: 0 8px 40px rgba(0,0,0,0.55); max-width: 560px; }
  .notfound-code { margin:0; font-size:clamp(3rem,10vw,5rem); font-weight:800; letter-spacing:2px; background: linear-gradient(180deg,var(--accent-1),var(--accent-2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .notfound-title { margin:.25rem 0 .5rem; color:var(--title-color); font-size:clamp(1.2rem,2.6vw,1.6rem); }
  .notfound-lead { margin:0 0 1.25rem; color:var(--desc-color); font-size:clamp(.9rem,1.5vw,1.05rem); }
  .home-btn { pointer-events:auto; appearance:none; border:none; text-decoration:none; display:inline-block; padding:10px 18px; border-radius:999px; background: linear-gradient(180deg,var(--accent-1),var(--accent-2)); color:#fff; font-weight:700; cursor:pointer; box-shadow: 0 8px 30px rgba(107,33,168,0.28); transition: transform 260ms ease; }
  .home-btn:hover { transform: translateY(-3px); }
</style>
</head>
<body class="alt-bg" style="background:var(--bg);">
<div class="notfound-hero">
  <div class="notfound-card">
    <p class="notfound-code">404</p>
    <h1 class="notfound-title">This cat wandered off</h1>
    <p class="notfound-lead">The page you're looking for doesn't exist, got moved, or is chasing something shiny somewhere else.</p>
    <a class="home-btn" href="/">Back Home</a>
  </div>
</div>
</body>
</html>
