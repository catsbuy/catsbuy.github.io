<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>SITE TITLE</title>
<link rel="icon" type="image/icon" href="[REPLACE WITH FAVICON]">
<link rel="stylesheet" href="index.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="targetElement">
<div class="hero" aria-hidden="false">
  <div class="card-hero" role="banner" aria-label="Welcome header">
    <h1>TITLE</h1>
    <p class="lead">DESCRIPTION</p>
    <div class="hero-cta">
      <button class="explore-btn" id="exploreBtn" onclick="hideContent()">BUTTON TEXT</button>
    </div>
  </div>
</div>
</div>
<!-- bottom wheel and glow -->
<div class="wheel-wrap" aria-hidden="false">
  <div class="glow-bar" id="glowBar">
    <div class="wheel" id="wheel" role="list" aria-label="Explore cards"></div>
    <div class="bottom-glow" id="bottomGlow" aria-hidden="true"></div>
  </div>
  <!-- expanded panel -->
  <div class="panel" id="panel" aria-hidden="true">
    <div class="thumb" id="panelThumb" role="img" aria-label=""></div>
    <div class="info">
      <h3 id="panelTitle">Title</h3>
      <p id="panelDesc">Short description about this destination.</p>
      <div><button class="launch-btn" id="panelLaunch">Launch</button></div>
    </div>
  </div>
</div>

<script src="index.js"></script>
</body>
</html>
